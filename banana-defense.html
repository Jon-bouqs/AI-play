<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Defense</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0f1f0d;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh;
  font-family:'Segoe UI',system-ui,sans-serif;
  color:#c9d1d9;
  user-select:none;
}
h1 {
  font-size:1.6rem; font-weight:700; letter-spacing:3px;
  text-transform:uppercase; color:#f5d020;
  text-shadow:0 0 18px #f5d02066;
  margin-bottom:10px;
}
#wrap { display:flex; gap:14px; align-items:flex-start; }
canvas { display:block; border-radius:6px; cursor:crosshair; }
#side { width:176px; display:flex; flex-direction:column; gap:9px; }

.srow { display:flex; gap:8px; }
.sbox {
  flex:1; background:#161b22; border:1px solid #30363d;
  border-radius:8px; padding:10px 8px; text-align:center;
}
.sval { font-size:22px; font-weight:700; line-height:1; }
.slbl { font-size:9px; text-transform:uppercase; letter-spacing:1px; color:#8b949e; margin-top:3px; }
.gv { color:#f5d020; } .lv { color:#f85149; } .wv { color:#58a6ff; }

.panel {
  background:#161b22; border:1px solid #30363d;
  border-radius:8px; padding:10px;
}
.plbl {
  font-size:10px; font-weight:600; text-transform:uppercase;
  letter-spacing:1.5px; color:#8b949e; margin-bottom:8px;
}
.tbtn {
  width:100%; background:#21262d; border:1.5px solid #30363d;
  border-radius:6px; padding:7px 9px; margin-bottom:5px;
  cursor:pointer; color:#c9d1d9; font-size:12px; text-align:left;
  transition:border-color .1s,background .1s;
  display:grid; grid-template-columns:1fr auto; gap:1px 4px;
}
.tbtn:last-of-type { margin-bottom:0; }
.tbtn:hover { background:#2d333b; }
.tbtn.act { border-color:var(--tc); background:color-mix(in srgb,var(--tc) 12%,#21262d); }
.tn { font-weight:600; color:var(--tc); } .tc { font-weight:700; color:#f5d020; }
.td { font-size:10px; color:#8b949e; grid-column:1/span 2; }

#sbtn {
  width:100%; padding:11px; background:#7c5c00; border:1px solid #c49a00;
  border-radius:8px; color:#fff; font-size:13px; font-weight:600;
  cursor:pointer; transition:background .12s;
}
#sbtn:hover:not(:disabled) { background:#a07800; }
#sbtn:disabled { background:#21262d; border-color:#30363d; color:#6e7681; cursor:default; }
#msg { font-size:11px; color:#8b949e; text-align:center; min-height:15px; }

.legend { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.leg { font-size:10px; color:#8b949e; display:flex; align-items:center; gap:4px; }
.leg span { width:10px; height:10px; border-radius:50%; display:inline-block; }
</style>
</head>
<body>
<h1>🍌 Banana Defense</h1>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="side">
    <div class="srow">
      <div class="sbox"><div class="sval gv" id="sg">100</div><div class="slbl">Gold</div></div>
      <div class="sbox"><div class="sval lv" id="sl">20</div><div class="slbl">Lives</div></div>
    </div>
    <div class="sbox"><div class="sval wv" id="sw">–</div><div class="slbl">Wave</div></div>
    <div class="panel">
      <div class="plbl">Place Banana</div>
      <button class="tbtn act" id="btn-basic" style="--tc:#f5d020" onclick="selTower('basic')">
        <span class="tn">🍌 Banana</span><span class="tc">50g</span>
        <span class="td">Fast throws · medium range</span>
      </button>
      <button class="tbtn" id="btn-slow" style="--tc:#a8d8ea" onclick="selTower('slow')">
        <span class="tn">🧊 Ice-nana</span><span class="tc">75g</span>
        <span class="td">Frozen banana · slows fish</span>
      </button>
      <button class="tbtn" id="btn-bomb" style="--tc:#ff8c42" onclick="selTower('bomb')">
        <span class="tn">💥 Bomb-nana</span><span class="tc">100g</span>
        <span class="td">Explosive splash damage</span>
      </button>
    </div>
    <button id="sbtn" onclick="startWave()">Start Wave 1</button>
    <div id="msg"></div>
    <div class="legend">
      <div class="leg"><span style="background:#1a4a7a"></span>River</div>
      <div class="leg"><span style="background:#f5d020"></span>Banana</div>
      <div class="leg"><span style="background:#a8d8ea"></span>Ice-nana</div>
      <div class="leg"><span style="background:#ff8c42"></span>Bomb-nana</div>
    </div>
  </div>
</div>

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────────────────────
const TILE=40, COLS=20, ROWS=15, W=COLS*TILE, H=ROWS*TILE;

const WPS=[[-1,2],[3,2],[3,6],[8,6],[8,2],[13,2],[13,10],[5,10],[5,13],[17,13],[17,6],[20,6]];

const TDEFS={
  basic:{name:'Banana',   cost:50,  color:'#f5d020',range:125,dmg:20, rate:720, spd:6.5,aoe:0,  slow:0   },
  slow: {name:'Ice-nana', cost:75,  color:'#a8d8ea',range:115,dmg:6,  rate:1300,spd:5,  aoe:0,  slow:0.45},
  bomb: {name:'Bomb-nana',cost:100, color:'#ff8c42',range:105,dmg:55, rate:2000,spd:3.5,aoe:78, slow:0   },
};

// ── Canvas ────────────────────────────────────────────────────────────────────
const cv=document.getElementById('c');
cv.width=W; cv.height=H;
const ctx=cv.getContext('2d');

// ── Path ──────────────────────────────────────────────────────────────────────
let pathSet, wayPx;

function buildPath(){
  pathSet=new Set();
  wayPx=WPS.map(([c,r])=>({x:c*TILE+TILE/2, y:r*TILE+TILE/2}));
  for(let i=0;i<WPS.length-1;i++){
    const [c0,r0]=WPS[i],[c1,r1]=WPS[i+1];
    if(c0===c1){
      const a=Math.min(r0,r1),b=Math.max(r0,r1);
      for(let r=a;r<=b;r++) if(c0>=0&&c0<COLS&&r>=0&&r<ROWS) pathSet.add(`${c0},${r}`);
    } else {
      const a=Math.min(c0,c1),b=Math.max(c0,c1);
      for(let c=a;c<=b;c++) if(c>=0&&c<COLS&&r0>=0&&r0<ROWS) pathSet.add(`${c},${r0}`);
    }
  }
}

// ── State ─────────────────────────────────────────────────────────────────────
let gold,lives,waveNum,waveOn,over;
let towers,enemies,bullets,sparks;
let spawnQ,spawnT;
let hc=-1,hr=-1,sel='basic';
let eid=0, ticker=0;

function init(){
  gold=100;lives=20;waveNum=0;waveOn=false;over=false;
  towers=[];enemies=[];bullets=[];sparks=[];
  spawnQ=[];spawnT=0;eid=0;ticker=0;
  hud(); btn('Start Wave 1',false);
  document.getElementById('msg').textContent='';
  document.getElementById('sw').textContent='–';
}

// ── Enemy (fish) ──────────────────────────────────────────────────────────────
function mkEnemy(wn){
  const hp=Math.round(75+wn*38);
  const sp=0.9+wn*0.09;
  return{id:eid++,x:wayPx[0].x,y:wayPx[0].y,hp,mhp:hp,sp,bsp:sp,wi:1,
    dead:false,out:false,slowT:0,ang:0};
}

function stepEnemy(e,dt){
  if(e.dead||e.out)return;
  e.slowT=Math.max(0,e.slowT-dt);
  const spd=(e.slowT>0?e.bsp*0.38:e.bsp)*dt*0.055;
  const t=wayPx[e.wi];
  if(!t){e.out=true;return;}
  const dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy);
  if(d>0.1) e.ang=Math.atan2(dy,dx);
  if(d<=spd+0.5){
    e.x=t.x;e.y=t.y;e.wi++;
    if(e.wi>=wayPx.length)e.out=true;
  } else { e.x+=dx/d*spd;e.y+=dy/d*spd; }
}

// ── Tower ─────────────────────────────────────────────────────────────────────
function mkTower(col,row,type){
  return{col,row,x:col*TILE+TILE/2,y:row*TILE+TILE/2,type,...TDEFS[type],cd:0,ang:0};
}

function stepTower(t,dt){
  t.cd-=dt;
  let best=null,bestWi=-1;
  for(const e of enemies){
    if(e.dead||e.out)continue;
    const dx=e.x-t.x,dy=e.y-t.y;
    if(dx*dx+dy*dy<=t.range*t.range&&e.wi>bestWi){bestWi=e.wi;best=e;}
  }
  if(best){
    t.ang=Math.atan2(best.y-t.y,best.x-t.x);
    if(t.cd<=0){t.cd=t.rate;fire(t,best);}
  }
}

// ── Bullet ────────────────────────────────────────────────────────────────────
function fire(tower,target){
  bullets.push({x:tower.x,y:tower.y,tref:target,
    spd:tower.spd,dmg:tower.dmg,aoe:tower.aoe,slow:tower.slow,
    col:tower.color,type:tower.type,dead:false,
    ang:Math.atan2(target.y-tower.y,target.x-tower.x)});
}

function stepBullet(b,dt){
  if(b.dead)return;
  const t=b.tref;
  if(!t||t.dead||t.out){b.dead=true;return;}
  const dx=t.x-b.x,dy=t.y-b.y,d=Math.hypot(dx,dy);
  const mv=b.spd*dt*0.055;
  if(d>0.1) b.ang=Math.atan2(dy,dx);
  if(d<=mv+5){
    b.dead=true;
    if(b.aoe>0){
      for(const e of enemies)
        if(!e.dead&&!e.out&&Math.hypot(e.x-t.x,e.y-t.y)<=b.aoe) dmgEnemy(e,b.dmg);
      boom(t.x,t.y);
    } else {
      dmgEnemy(t,b.dmg);
      if(b.slow>0)t.slowT=2300;
    }
  } else { b.x+=dx/d*mv;b.y+=dy/d*mv; }
}

function dmgEnemy(e,dmg){
  if(e.dead)return;
  e.hp-=dmg;
  if(e.hp<=0){
    e.dead=true;
    gold+=8+waveNum*2;
    splash(e.x,e.y);
    hud();
  }
}

// ── Particles ─────────────────────────────────────────────────────────────────
function splash(x,y){
  // water splash when fish is hit
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:500,ml:500,c:i%2?'#5bc8f5':'#ffffff',r:2+Math.random()*2});
  }
}
function boom(x,y){
  for(let i=0;i<22;i++){
    const a=(Math.PI*2/22)*i,s=1.5+Math.random()*4;
    const c=i%3===0?'#ff8c42':i%3===1?'#f5d020':'#fff';
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:700,ml:700,c,r:3+Math.random()*3});
  }
}

// ── Wave ──────────────────────────────────────────────────────────────────────
function startWave(){
  if(waveOn||over)return;
  waveNum++;waveOn=true;
  const n=5+waveNum*3;
  spawnQ=Array.from({length:n},()=>waveNum);
  spawnT=0;
  btn(`Wave ${waveNum} in progress…`,true);
  document.getElementById('sw').textContent=waveNum;
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function hud(){
  document.getElementById('sg').textContent=gold;
  document.getElementById('sl').textContent=lives;
  document.getElementById('sw').textContent=waveNum||'–';
}
function btn(t,dis){
  const b=document.getElementById('sbtn');b.textContent=t;b.disabled=dis;
}
function selTower(type){
  sel=type;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('act'));
  document.getElementById(`btn-${type}`).classList.add('act');
}
function showMsg(t){
  document.getElementById('msg').textContent=t;
  if(t)setTimeout(()=>{document.getElementById('msg').textContent='';},1600);
}

// ── Input ─────────────────────────────────────────────────────────────────────
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  hc=Math.floor((e.clientX-r.left)/TILE);
  hr=Math.floor((e.clientY-r.top)/TILE);
});
cv.addEventListener('mouseleave',()=>{hc=-1;hr=-1;});
cv.addEventListener('click',e=>{
  if(over){init();return;}
  const r=cv.getBoundingClientRect();
  const col=Math.floor((e.clientX-r.left)/TILE);
  const row=Math.floor((e.clientY-r.top)/TILE);
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  if(pathSet.has(`${col},${row}`)){showMsg('Cannot build on the river');return;}
  if(towers.some(t=>t.col===col&&t.row===row)){showMsg('Tile occupied');return;}
  const def=TDEFS[sel];
  if(gold<def.cost){showMsg(`Need ${def.cost}g (have ${gold}g)`);return;}
  gold-=def.cost;
  towers.push(mkTower(col,row,sel));
  hud();showMsg('');
});

// ── Draw helpers ──────────────────────────────────────────────────────────────

// Draw a banana shape: crescent pointing in +x direction (caller applies rotation)
function drawBanana(color, scale=1){
  ctx.save();
  ctx.scale(scale,scale);
  ctx.fillStyle=color;
  // Outer curve (back/peel)
  ctx.beginPath();
  ctx.moveTo(-7, 3);
  ctx.bezierCurveTo(-2, -12, 12, -12, 16, -1);
  ctx.bezierCurveTo(12, -6, -1, -6, -7, 3);
  ctx.closePath();
  ctx.fill();
  // Highlight stripe
  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=1.5/scale;
  ctx.beginPath();
  ctx.moveTo(-4, 1);
  ctx.bezierCurveTo(1, -9, 10, -9, 14, -2);
  ctx.stroke();
  // Tip nub
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(16,-1,2.5,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-7,3,2.5,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// Draw a fish shape at (0,0) facing +x, caller applies translate/rotate
function drawFish(bodyColor, frosted){
  // Tail
  ctx.beginPath();
  ctx.moveTo(-9, 0);
  ctx.lineTo(-16, -8);
  ctx.lineTo(-16, 8);
  ctx.closePath();
  ctx.fillStyle=bodyColor;
  ctx.fill();
  // Body
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI*2);
  ctx.fillStyle=bodyColor;
  ctx.fill();
  // Belly highlight
  ctx.beginPath();
  ctx.ellipse(2, 2, 7, 3.5, 0, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fill();
  // Dorsal fin
  ctx.beginPath();
  ctx.moveTo(2,-7);ctx.lineTo(6,-13);ctx.lineTo(10,-7);
  ctx.fillStyle=bodyColor;ctx.fill();
  // Eye
  ctx.beginPath();ctx.arc(8,-2,2.5,0,Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.arc(8.5,-2,1.2,0,Math.PI*2);
  ctx.fillStyle='#111';ctx.fill();
  // Frost overlay
  if(frosted){
    ctx.beginPath();ctx.ellipse(0,0,12,7,0,0,Math.PI*2);
    ctx.fillStyle='rgba(168,216,234,0.35)';ctx.fill();
  }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw(){
  ticker+=16;

  // Grass background
  ctx.fillStyle='#1a2e0f';
  ctx.fillRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle='#1f3515';ctx.lineWidth=1;
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*TILE,0);ctx.lineTo(c*TILE,H);ctx.stroke();}
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*TILE);ctx.lineTo(W,r*TILE);ctx.stroke();}

  // River tiles
  for(const key of pathSet){
    const[c,r]=key.split(',').map(Number);
    const tx=c*TILE, ty=r*TILE;
    // Water fill
    ctx.fillStyle='#0d3361';
    ctx.fillRect(tx+1,ty+1,TILE-2,TILE-2);
    // Lighter water center
    ctx.fillStyle='#1a4a82';
    ctx.fillRect(tx+4,ty+4,TILE-8,TILE-8);
    // Animated ripple lines
    const wave=(ticker*0.04+c*0.7+r*1.3)%(TILE);
    ctx.strokeStyle='rgba(91,200,245,0.2)';ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(tx+2, ty+wave%TILE);
    ctx.lineTo(tx+TILE-2, ty+wave%TILE);
    ctx.stroke();
    // Bank edge highlight
    ctx.strokeStyle='#2a6aaa';ctx.lineWidth=1;
    ctx.strokeRect(tx+1,ty+1,TILE-2,TILE-2);
  }

  // Entry / exit
  ctx.fillStyle='#5bc8f5';ctx.font='bold 12px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🐟',8,WPS[0][1]*TILE+TILE/2);
  ctx.fillText('🌊',W-8,WPS[WPS.length-1][1]*TILE+TILE/2);

  // Hover highlight
  if(hc>=0&&hr>=0&&!over){
    const onPath=pathSet.has(`${hc},${hr}`);
    const occ=towers.some(t=>t.col===hc&&t.row===hr);
    ctx.fillStyle=onPath||occ?'rgba(248,81,73,.22)':'rgba(245,208,32,.15)';
    ctx.fillRect(hc*TILE,hr*TILE,TILE,TILE);
    if(!onPath&&!occ){
      ctx.beginPath();
      ctx.arc(hc*TILE+TILE/2,hr*TILE+TILE/2,TDEFS[sel].range,0,Math.PI*2);
      ctx.strokeStyle=TDEFS[sel].color+'38';ctx.lineWidth=1;ctx.stroke();
    }
  }

  // Towers
  for(const t of towers){
    const def=TDEFS[t.type],{x,y}=t;
    // Wooden post base
    ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);
    ctx.fillStyle='#3d2b1f';ctx.fill();
    ctx.strokeStyle=def.color;ctx.lineWidth=2;ctx.stroke();
    // Wood grain lines
    ctx.strokeStyle='rgba(255,200,100,0.15)';ctx.lineWidth=1;
    for(let i=-1;i<=1;i++){
      ctx.beginPath();ctx.moveTo(x-14,y+i*5);ctx.lineTo(x+14,y+i*5);ctx.stroke();
    }
    // Banana projectile/weapon pointing at target
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(t.ang);
    if(t.type==='bomb'){
      // Big overripe banana
      ctx.translate(2,0);
      drawBanana('#ff8c42',1.1);
      // Fuse
      ctx.strokeStyle='#888';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-5,3);ctx.lineTo(-9,-3);ctx.stroke();
      ctx.beginPath();ctx.arc(-9,-3,2,0,Math.PI*2);
      ctx.fillStyle='#ff4';ctx.fill();
    } else if(t.type==='slow'){
      // Ice banana (pale blue)
      ctx.translate(2,0);
      drawBanana('#a8d8ea',1.0);
      // Ice crystals
      ctx.strokeStyle='rgba(200,240,255,0.7)';ctx.lineWidth=1;
      for(let i=0;i<3;i++){
        const bx=i*5-2,by=-8+i*2;
        ctx.beginPath();ctx.moveTo(bx,by-3);ctx.lineTo(bx,by+3);ctx.stroke();
        ctx.beginPath();ctx.moveTo(bx-3,by);ctx.lineTo(bx+3,by);ctx.stroke();
      }
    } else {
      // Standard yellow banana
      ctx.translate(2,0);
      drawBanana('#f5d020',1.0);
    }
    ctx.restore();
  }

  // Enemies (fish)
  for(const e of enemies){
    if(e.dead||e.out)continue;
    // Shadow on water
    ctx.save();
    ctx.translate(e.x,e.y+8);
    ctx.beginPath();ctx.ellipse(0,0,10,4,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fill();
    ctx.restore();
    // Fish body
    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.rotate(e.ang);
    const frosted=e.slowT>0;
    // Pick fish color based on HP
    const pct=e.hp/e.mhp;
    const fc=pct>0.5?'#e05c2a':pct>0.25?'#c0392b':'#8b0000';
    drawFish(fc,frosted);
    ctx.restore();
    // HP bar
    const bw=24,bh=3,bx=e.x-bw/2,by=e.y-22;
    ctx.fillStyle='#21262d';ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    ctx.fillStyle='#30363d';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=pct>.6?'#3fb950':pct>.3?'#e3b341':'#f85149';
    ctx.fillRect(bx,by,bw*pct,bh);
  }

  // Bullets (flying bananas)
  for(const b of bullets){
    if(b.dead)continue;
    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.rotate(b.ang);
    if(b.type==='bomb'){
      drawBanana('#ff8c42',0.55);
    } else if(b.type==='slow'){
      drawBanana('#a8d8ea',0.5);
    } else {
      drawBanana('#f5d020',0.5);
    }
    ctx.restore();
  }

  // Sparks / splash particles
  for(const s of sparks){
    const a=s.life/s.ml;
    ctx.globalAlpha=a;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*a,0,Math.PI*2);
    ctx.fillStyle=s.c;ctx.fill();
  }
  ctx.globalAlpha=1;

  // Game-over overlay
  if(over){
    ctx.fillStyle='rgba(10,20,5,.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#f5d020';ctx.shadowBlur=30;
    ctx.fillStyle='#f5d020';ctx.font='bold 54px "Segoe UI"';
    ctx.fillText('GAME OVER',W/2,H/2-50);
    ctx.shadowBlur=0;
    ctx.fillStyle='#c9d1d9';ctx.font='22px "Segoe UI"';
    ctx.fillText(`The fish got through after ${waveNum} wave${waveNum!==1?'s':''}`,W/2,H/2+5);
    ctx.fillStyle='#f5d020';ctx.font='bold 16px "Segoe UI"';
    ctx.fillText('Click anywhere to try again',W/2,H/2+50);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
  }
}

// ── Update ────────────────────────────────────────────────────────────────────
let last=0;
function update(dt){
  if(over)return;
  if(waveOn&&spawnQ.length>0){
    spawnT-=dt;
    if(spawnT<=0){enemies.push(mkEnemy(spawnQ.shift()));spawnT=1050;}
  }
  for(const e of enemies)stepEnemy(e,dt);
  for(const t of towers)stepTower(t,dt);
  for(const b of bullets)stepBullet(b,dt);
  for(const e of enemies){
    if(e.out&&!e.dead){
      e.dead=true;lives--;hud();
      if(lives<=0){over=true;btn('—',true);}
    }
  }
  for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vx*=.91;s.vy*=.91;s.life-=dt;}
  enemies=enemies.filter(e=>!e.dead);
  bullets=bullets.filter(b=>!b.dead);
  sparks=sparks.filter(s=>s.life>0);
  if(waveOn&&spawnQ.length===0&&enemies.length===0){
    waveOn=false;
    btn(`Start Wave ${waveNum+1}`,false);
  }
}

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop(ts){
  const dt=Math.min(ts-last,50);last=ts;
  update(dt);draw();
  requestAnimationFrame(loop);
}

buildPath();
init();
requestAnimationFrame(ts=>{last=ts;requestAnimationFrame(loop);});
</script>
</body>
